<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Daily Motivation — Цитата дня</title>
  <meta name="description" content="A daily motivational quote, matched to what the world is talking about today.">
  <meta property="og:title" content="Daily Motivation">
  <meta property="og:description" content="A daily motivational quote, matched to what the world is talking about today.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span id="brand-label" data-i18n="brand">Daily Motivation</span>
    </div>
    <button id="lang-toggle" class="lang-toggle" title="Switch language" data-i18n="switch">RU</button>
  </header>

  <main class="stage">
    <div class="meta-row">
      <span id="theme-label"></span>
      <span id="date-label"></span>
    </div>

    <figure class="media">
      <img id="quote-image" src="" alt="">
    </figure>

    <div class="quote-block">
      <blockquote id="quote-text">&hellip;</blockquote>
      <p class="quote-author" id="quote-author"></p>
      <div class="actions">
        <button id="share-btn" class="action-btn" type="button" data-i18n="share">Share</button>
        <a class="action-btn" href="archive.html" data-i18n="archive">Archive</a>
      </div>
    </div>
  </main>

  <footer class="sourcebar">
    <p class="footnote" data-i18n="footnote">A new quote every day — matched to the news.</p>
    <a id="quote-source" target="_blank" rel="noopener"></a>
    <a id="photo-credit" target="_blank" rel="noopener" style="display:none"></a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
